name: Speedrun tests

# Focused CI for the Speedrun LSAT changes. Runs the Rust engine change (the
# schema-weighted queue) and the iOS C-FFI bridge tests on every push/PR. The
# full Python/desktop and iOS-simulator suites run locally (they need the full
# Anki build / Xcode); this job keeps the core engine change honest and green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: speedrun-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust engine + FFI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # anki_i18n gathers Fluent translations from the ftl/*-repo submodules.
          submodules: recursive

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version
          # anki_proto's build.rs uses prost-build, which needs protoc; point it
          # at the binary explicitly so it is found regardless of PATH nuances.
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Provide build hash
        # rslib/build.rs reads out/buildhash (normally written by Anki's build
        # system) and bakes it in as BUILDHASH; without it the hash is empty and
        # the engine's buildhash smoke test fails.
        run: |
          mkdir -p out
          echo "${GITHUB_SHA}" > out/buildhash

      # Rust 1.92.0 is pinned in rust-toolchain.toml and auto-installed by cargo.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Rust unit tests — schema-weighted queue (the required Rust change)
        run: cargo test -p anki schema_weighted

      - name: Rust unit tests — speedrun scores (memory/performance/readiness)
        run: cargo test -p anki speedrun_scores

      - name: Rust FFI tests — open the exam deck + queue over the C bridge
        run: cargo test -p rslib-ffi

  ai:
    name: Offline AI tests (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: AI unit tests (scripted client, no LLM, no anki build)
        # Copy the test out of pylib/tests so pytest does not trigger that
        # package's __init__ (which imports the built anki backend). Excludes the
        # one test needing anki; the rest (client, guard, generation, checker,
        # eval, baselines) are stdlib-only.
        env:
          SPEEDRUN_AI_OFF: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/aitests"
          cp pylib/tests/test_speedrun_ai.py "$RUNNER_TEMP/aitests/"
          cd "$RUNNER_TEMP/aitests"
          python -m pytest test_speedrun_ai.py -k "not compute_with_ai_off" -q
