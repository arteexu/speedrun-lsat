name: SpeedrunLSAT
options:
  bundleIdPrefix: com.speedrunlsat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AnkiKit:
    path: ../AnkiKit

targets:
  SpeedrunLSAT:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    dependencies:
      - package: AnkiKit
        product: AnkiKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.speedrunlsat.app
        PRODUCT_NAME: Speedrun LSAT
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Speedrun LSAT
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
